<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンデレラケアプランセンター</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
            background-color: #fcfbfa;
            color: #333;
        }

        /* ヘッダー画像エリア */
        .hero {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 20px 10px 20px;
            text-align: center;
        }

        /* 画像サイズ調整 */
        .hero-img {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* 本文エリア */
        .content {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 20px 40px 20px;
        }

        .content h3 {
            font-size: 1.2rem;
            color: #222;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .content p {
            line-height: 1.8;
            color: #444;
            font-size: 1rem;
            text-align: left;
        }

        /* フッター（お知らせなどのリンクメニュー） */
        .footer-menu {
            max-width: 700px;
            margin: 20px auto 60px auto;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .footer-menu a {
            color: #333;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .footer-menu a:hover {
            color: #A52A2A;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- ヘッダー画像（重複テキストなし） -->
    <div class="hero">
        <img src="cinderera.png" alt="シンデレラケアプランセンター" class="hero-img">
    </div>

    <!-- 本文エリア -->
    <div class="content">
        <h3>シンデレラケアプランセンターについて</h3>
        <p>
            わたしは、「つくらないケアマネ」です。わたしは、ご本人がこうありたい、こうあってきたというイメージをつくります。ご本人が介護されるかたに伝えやすいイメージが目で見て分かるように、文書ではなく、いっしょに絵でつくりたいと思います。ただいま、開設準備中です。
        </p>
    </div>

    <!-- フッターメニュー（お知らせなど） -->
    <div class="footer-menu">
        <a href="#">お知らせ</a>
        <a href="#">わたしたちについて</a>
        <a href="#">個人の情報の取り扱いについて</a>
    </div>

</body>
</html>
